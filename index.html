<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rustwebtest</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a12;
    color: #ddd;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #canvas {
    display: block;
    width: min(100vmin, 90vh);
    height: min(100vmin, 90vh);
    background: #111;
  }
  #overlay {
    position: fixed;
    top: 8px;
    left: 8px;
    font-size: 12px;
    opacity: 0.6;
    pointer-events: none;
  }
  #gesture {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    cursor: pointer;
    font-size: 18px;
  }
  #gesture.hidden { display: none; }
</style>
</head>
<body>
  <canvas id="canvas" width="1024" height="1024"></canvas>
  <div id="overlay">rustwebtest — wgpu + cpal + web-thread</div>
  <div id="gesture">click to start audio</div>

  <script type="module">
    import init, { unlockAudio } from "./pkg/rustwebtest.js";

    // wasm-bindgen with --target web requires SharedArrayBuffer to be
    // available for thread support. Verify cross-origin isolation up front.
    if (!window.crossOriginIsolated) {
      document.getElementById("overlay").innerHTML =
        "WARNING: not crossOriginIsolated — wasm threads will not work. " +
        "Needs COOP=same-origin and COEP=require-corp (itch.io: enable SharedArrayBuffer in project embed settings; local: ./serve.sh).";
    }

    // Init the wasm module. The default import url resolves to the .wasm.
    await init();

    // Fullscreen overlay is above the canvas: the first tap must unlock audio
    // here (same user-activation stack); winit never sees that event.
    const gesture = document.getElementById("gesture");
    const dismiss = () => {
      unlockAudio();
      gesture.classList.add("hidden");
    };
    gesture.addEventListener("click", dismiss, { once: true });
    gesture.addEventListener("touchstart", dismiss, { once: true, passive: true });
  </script>
</body>
</html>
